name: essivivi_mobile
description: "Application mobile ESSIVIVI pour clients et agents de livraison"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^9.2.0

  # Network
  dio: ^5.9.0

  # Local Storage
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^15.1.2

  # Utilities
  intl: ^0.20.2
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

